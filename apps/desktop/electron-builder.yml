# Windows installer and portable build: `pnpm dist` (from the repo root) or `pnpm --filter @dnd/desktop dist`.
# The app is unsigned, so Windows SmartScreen asks "Run anyway" on first start.
appId: com.dndtypeshit.app
productName: DND TYPESHIT
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - '**/*.wasm'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DND TYPESHIT
  artifactName: DND-TYPESHIT-Setup-${version}.${ext}
portable:
  artifactName: DND-TYPESHIT-Portable-${version}.${ext}
